[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiac-imaging"
version = "0.1.0"
description = "Cardiac imaging utilization in Medicare FFS, 2018–2023"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "plotly>=5.18",
    "kaleido>=0.2.1",
    "pillow>=10.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
notebook = ["ipykernel", "papermill"]
test = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
    "slow: longer end-to-end tests",
    "real_data: needs the real ~/Downloads/cms_parquet/cms.duckdb (skipped in CI)",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore:FigureCanvasAgg is non-interactive"]

[tool.coverage.run]
source = ["src/cardiac_imaging"]
