# Claude fixes code when an issue/comment mentions @claude or an issue gets the notebook-error label.
name: Claude

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  actions: read

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || github.event.label.name == 'notebook-error')) ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package (so Claude can import-check its fix; the data stays on your Mac)
        run: pip install -e . -q
      - uses: anthropics/claude-code-action@v1
        with:
          # Set ONE of these secrets (the /install-github-app command does it for you)
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: notebook-error
          claude_args: |
            --max-turns 30
            --allowedTools "Bash(python:*),Bash(pip:*),Bash(git:*),Read,Edit,Write,Glob,Grep"
