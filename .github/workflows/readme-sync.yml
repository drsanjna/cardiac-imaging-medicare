# On every push, rebuild all README.md files from the code and commit them back if they changed.
name: readme-sync

on:
  push:
    branches: ['**']
    paths-ignore: ['**/README.md', 'README.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate READMEs (standard library only, no installs)
        run: python scripts/update_readmes.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain -- README.md '*/README.md')" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md '*/README.md'
            git commit -m "docs: regenerate READMEs [skip ci]"
            git push
          else
            echo "READMEs already up to date."
          fi
